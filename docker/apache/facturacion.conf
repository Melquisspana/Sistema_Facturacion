# ============================================================================
# VirtualHost de la aplicación dentro del contenedor web.
# A partir de docs/apache/facturacion.conf.example (Windows/Laragon).
#
#   Red local (oficina y lectores ESP32, Host: facturacion.test) ---> :80
#   cloudflared (red frontend de compose, http://web:80) ------------> :80
#
# Es el ÚNICO vhost y el primero, así que también atiende cualquier otro Host:
# la IP de la red local y el nombre de Tailscale. El dominio público llega como
# APACHE_DOMINIO_PUBLICO (variable del contenedor; ver .env.compose.example).
#
# HTTPS lo termina Cloudflare (o Tailscale Serve). Laravel sabe si el pedido entró
# por HTTPS solo si viene de un proxy de confianza (TRUSTED_PROXIES).
# ============================================================================

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerName facturacion.test
    ServerAlias ${APACHE_DOMINIO_PUBLICO}

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Los registros salen por la salida estándar del contenedor (docker compose logs web).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
