# ============================================================================
# VirtualHost de la aplicación dentro del contenedor web.
# A partir de docs/apache/facturacion.conf.example (Windows/Laragon).
#
#   Red local (oficina y lectores ESP32, Host: facturacion.test) ---> :80
#   cloudflared (red frontend de compose, http://web:80) ------------> :80
#   Red local sin internet (contingencia, https://<IP local>) -------> :443 (al final)
#
# El filtro del Host lo hace Apache: el primer vhost responde 404 a todo Host que no
# esté en la lista. Así nadie de la red local puede mandar un Host ajeno para que
# Laravel arme enlaces (por ejemplo el de «olvidé mi contraseña») hacia otro dominio.
# La app atiende facturacion.test (lectores ESP32 y oficina), localhost (healthcheck),
# el dominio público (APACHE_DOMINIO_PUBLICO) y APACHE_HOSTS_EXTRA: la IP de la red
# local y el nombre de Tailscale, separados por espacios. Ver .env.compose.example.
#
# HTTPS lo termina Cloudflare (o Tailscale Serve). Laravel sabe si el pedido entró
# por HTTPS solo si viene de un proxy de confianza (TRUSTED_PROXIES). La excepción es
# el 443 de la red local: ahí lo termina este Apache y Laravel lo ve directo.
# ============================================================================

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Primero (el de por defecto): cualquier Host que no esté abajo.
<VirtualHost *:80>
    ServerName _default_
    Redirect 404 /
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName facturacion.test
    ServerAlias localhost ${APACHE_DOMINIO_PUBLICO} ${APACHE_HOSTS_EXTRA}

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Los registros salen por la salida estándar del contenedor (docker compose logs web).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# ----------------------------------------------------------------------------
# HTTPS de la red local: contingencia sin internet (decisión 0006 §1.1).
# Sin internet, las PC de la oficina entran por https://<IP local del servidor> con un
# certificado autofirmado. Por http:// el navegador no guarda la cookie de sesión
# segura y no se puede iniciar sesión.
#
# Existe solo si el entrypoint arranca Apache con -D FACTURACION_LAN_HTTPS. Lo hace si
# están el certificado y la llave (montados del host en /etc/facturacion/tls, nunca en
# la imagen), LAN_SUBNET y LAN_HOST, y si esta parte pasa la prueba de configuración.
# Si falta algo, el 443 no se abre y el 80 arranca igual.
#
# Igual que el 80: la misma lista de Host (más LAN_HOST, la IP local) y lo demás. Además,
# solo responde a la red de la oficina (LAN_SUBNET).
# ----------------------------------------------------------------------------
<IfDefine FACTURACION_LAN_HTTPS>
    Listen 443

    # Fuera de los vhost: los dos usan el mismo certificado. Sin SNI (un navegador que
    # entra por IP no lo manda) el saludo TLS lo hace el primero y el Host elige después.
    SSLCertificateFile    /etc/facturacion/tls/lan.crt
    SSLCertificateKeyFile /etc/facturacion/tls/lan.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <VirtualHost *:443>
        ServerName _default_
        SSLEngine on
        Redirect 404 /
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>

    <VirtualHost *:443>
        ServerName facturacion.test
        ServerAlias localhost ${APACHE_DOMINIO_PUBLICO} ${APACHE_HOSTS_EXTRA} ${LAN_HOST}
        SSLEngine on

        DocumentRoot /var/www/html/public

        <Directory /var/www/html/public>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        # Solo la red de la oficina. Va en <Location> porque se aplica después de
        # <Directory> y de los .htaccess: nada dentro de public/ lo puede abrir.
        # AuthMerging And: se suma a lo anterior en vez de reemplazarlo. Sin esto, los
        # «Require all denied» de antes (el de los .ht* de apache2.conf o el de un
        # .htaccess) dejarían de valer por el 443.
        <Location />
            AuthMerging And
            Require ip ${LAN_SUBNET}
        </Location>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfDefine>
