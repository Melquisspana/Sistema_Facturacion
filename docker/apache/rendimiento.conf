# ============================================================================
# Cuánto deja Apache abierta una conexión quieta (prueba de carga del 16/11/2026).
# Se carga después de apache2.conf (conf-enabled), así que reemplaza sus valores.
#
# La imagen php:8.3-apache usa prefork: un proceso PHP por conexión, con un tope de 150
# (MaxRequestWorkers). Con los 5 s de KeepAlive que trae Debian, cada persona que abre
# una página deja ocupado un proceso 5 s aunque después solo mire la pantalla. Cerca de
# 250 usuarios se llenaban los 150 y el resto esperaba en fila: con 500, el p95 fue de
# 15 s. Con KeepAlive apagado bajó a 0,32 s.
#
# Por qué 2 s y no apagado:
#  - Una página pide enseguida su CSS, su JS y sus íconos: con 2 s van por la misma
#    conexión y no se abre una por archivo.
#  - Por el dominio entra cloudflared (compose.yaml, http://web:80), que mantiene unas
#    pocas conexiones abiertas y las reusa para muchos usuarios. Apagado, abriría una
#    conexión nueva para cada pedido.
#  - En el HTTPS de la red local (443), cada conexión nueva repite el saludo TLS.
# Se midieron 5 s y apagado; 2 s queda entre los dos y no se midió.
#
# MaxRequestWorkers queda en 150 a propósito: subirlo pide subir también max_connections
# de MySQL (151), y esa es otra decisión.
# ============================================================================

KeepAlive On
KeepAliveTimeout 2
