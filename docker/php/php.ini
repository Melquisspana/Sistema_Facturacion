; Ajustes de PHP para la imagen de la aplicación. Ver docs/MIGRACION_LINUX_DOCKER.md §2.3.
; Se carga después de php.ini-production.

; Gastos acepta hasta 10 archivos de 10 MB por envío (config/gastos.php).
upload_max_filesize = 12M
post_max_size = 110M
max_file_uploads = 20

; El mismo límite que hoy en Laragon.
memory_limit = 512M

; En Windows no hay límite (0). Un pedido web puede lanzar mysqldump (hasta 300 s en
; backup:mysql-diario); 30 s, el valor por defecto, lo cortaría. Pendiente P10.
max_execution_time = 300

; La app ya fija la zona en config/app.php; esto alinea al CLI y a los registros de PHP.
date.timezone = America/El_Salvador

expose_php = Off

; El código no cambia dentro de la imagen: cada despliegue reinicia los contenedores.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
